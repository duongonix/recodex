name: Release RecoDex

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: recodex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pin npm to the lockfile generator version
        run: npm install --global npm@11.17.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release tag and app versions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargoManifest = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargoManifest.match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];
          const expectedTag = `v${packageVersion}`;

          if (process.env.GITHUB_REPOSITORY !== 'duongonix/recodex') {
            throw new Error(`This release workflow only publishes duongonix/recodex, not ${process.env.GITHUB_REPOSITORY}`);
          }

          if (!cargoVersion || new Set([packageVersion, tauriVersion, cargoVersion]).size !== 1) {
            throw new Error(`Version mismatch: package.json=${packageVersion}, tauri.conf.json=${tauriVersion}, Cargo.toml=${cargoVersion ?? 'missing'}`);
          }

          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} must match app version tag ${expectedTag}`);
          }

          console.log(`Releasing RecoDex ${packageVersion} from ${expectedTag}`);
          NODE

      - name: Require the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Missing repository Actions secret TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  prepare_release:
    name: Prepare draft release
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
      - name: Create or reuse the draft release
        id: prepare
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const existing = releases.find((release) => release.tag_name === tag);

            if (existing) {
              if (!existing.draft) {
                throw new Error(`Release ${tag} already exists and is published.`);
              }
              core.setOutput('release_id', existing.id);
              core.info(`Reusing draft release ${existing.id} for ${tag}.`);
            } else {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `RecoDex ${tag}`,
                body: 'Install the package matching your operating system and processor. Windows uses the NSIS installer; Linux AppImage users receive in-app updates, while DEB/RPM users update through their package manager.',
                draft: true,
                prerelease: false,
                generate_release_notes: true,
              });
              core.setOutput('release_id', created.data.id);
              core.info(`Created draft release ${created.data.id} for ${tag}.`);
            }

  build-and-upload:
    name: Build ${{ matrix.name }}
    needs: [quality, prepare_release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Build and upload unique per-target assets concurrently. The updater
      # manifest is generated once in publish-release after every target passes.
      max-parallel: 6
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            apple_identity: ""
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            apple_identity: ""
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            apple_identity: "-"
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            apple_identity: "-"
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            apple_identity: ""
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            apple_identity: ""
    env:
      # GITHUB_TOKEN uploads release assets; this separate secret signs updater bundles.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ matrix.apple_identity }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libv4l-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            rpm \
            squashfs-tools \
            wget \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pin npm to the lockfile generator version
        run: npm install --global npm@11.17.0

      - name: Install Rust stable and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload signed bundles
        uses: tauri-apps/tauri-action@v1
        with:
          owner: duongonix
          repo: recodex
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: RecoDex ${{ github.ref_name }}
          releaseBody: "Install the package matching your operating system and processor. Windows uses the NSIS installer; Linux AppImage users receive in-app updates, while DEB/RPM users update through their package manager."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          # Concurrent matrix jobs must not replace the same latest.json asset.
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish-release:
    name: Publish complete release
    needs: build-and-upload
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate signed updater manifest and publish release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const release = releases.find((candidate) => candidate.tag_name === tag);
            if (!release || !release.draft) {
              throw new Error(`Could not find a draft release for ${tag}.`);
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            const assetsByName = new Map(assets.map((asset) => [asset.name, asset]));
            const platforms = {};

            function platformForSignature(name) {
              let match = name.match(/_(x64|amd64|x86_64)-setup\.exe\.sig$/i);
              if (match) return { os: 'windows', arch: 'x86_64', bundle: 'nsis', primary: true };
              match = name.match(/_(arm64|aarch64)-setup\.exe\.sig$/i);
              if (match) return { os: 'windows', arch: 'aarch64', bundle: 'nsis', primary: true };

              match = name.match(/_(amd64|x86_64|x64)\.AppImage\.sig$/i);
              if (match) return { os: 'linux', arch: 'x86_64', bundle: 'appimage', primary: true };
              match = name.match(/_(arm64|aarch64)\.AppImage\.sig$/i);
              if (match) return { os: 'linux', arch: 'aarch64', bundle: 'appimage', primary: true };

              match = name.match(/_(amd64|x86_64|x64)\.deb\.sig$/i);
              if (match) return { os: 'linux', arch: 'x86_64', bundle: 'deb', primary: false };
              match = name.match(/_(arm64|aarch64)\.deb\.sig$/i);
              if (match) return { os: 'linux', arch: 'aarch64', bundle: 'deb', primary: false };
              match = name.match(/\.(x86_64|amd64)\.rpm\.sig$/i);
              if (match) return { os: 'linux', arch: 'x86_64', bundle: 'rpm', primary: false };
              match = name.match(/\.(aarch64|arm64)\.rpm\.sig$/i);
              if (match) return { os: 'linux', arch: 'aarch64', bundle: 'rpm', primary: false };

              return null;
            }

            const signatures = assets.filter((asset) => asset.name.endsWith('.sig'));
            for (const signatureAsset of signatures) {
              const target = platformForSignature(signatureAsset.name);
              if (!target) continue;

              const bundleName = signatureAsset.name.slice(0, -'.sig'.length);
              const bundleAsset = assetsByName.get(bundleName);
              if (!bundleAsset) {
                throw new Error(`Missing signed updater bundle ${bundleName}.`);
              }

              const response = await github.request(
                'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                {
                  owner,
                  repo,
                  asset_id: signatureAsset.id,
                  headers: { accept: 'application/octet-stream' },
                },
              );
              const signature = Buffer.from(response.data).toString('utf8');
              if (!signature.trim()) {
                throw new Error(`Updater signature ${signatureAsset.name} is empty.`);
              }

              const entry = {
                signature,
                url: `https://api.github.com/repos/${owner}/${repo}/releases/assets/${bundleAsset.id}`,
              };
              platforms[`${target.os}-${target.arch}-${target.bundle}`] = entry;
              if (target.primary) platforms[`${target.os}-${target.arch}`] = entry;
            }

            const requiredPlatforms = [
              'windows-x86_64',
              'windows-aarch64',
              'linux-x86_64',
              'linux-aarch64',
            ];
            const missing = requiredPlatforms.filter((key) => !platforms[key]);
            if (missing.length) {
              throw new Error(`Missing signed updater targets: ${missing.join(', ')}.`);
            }

            const manifest = Buffer.from(JSON.stringify({
              version: tag.replace(/^v/, ''),
              notes: release.body ?? '',
              pub_date: new Date().toISOString(),
              platforms,
            }, null, 2));

            const existingManifest = assetsByName.get('latest.json');
            if (existingManifest) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: existingManifest.id,
              });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: 'latest.json',
              data: manifest,
              headers: {
                'content-type': 'application/json',
                'content-length': manifest.length,
              },
            });

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              draft: false,
            });
            core.info(`Published ${owner}/${repo} ${tag} with ${Object.keys(platforms).length} updater entries.`);
